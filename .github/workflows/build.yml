name: Build Synology WireGuard SPK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile SPK for rtd1296 (DSM 7.3)
        run: |
          mkdir -p output
          docker run --rm --privileged --env PACKAGE_ARCH=rtd1296 --env DSM_VER=7.3 -v ${{ github.workspace }}/output:/result_spk blackvoidclub/synobuild73

      - name: Upload SPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireGuard-rtd1296-dsm7.3
          path: |
            output/*.spk
            **/*.spk
