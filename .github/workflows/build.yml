name: Build Synology WireGuard SPK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile SPK for rtd1296 (DSM 7)
        run: |
          mkdir -p output
          docker run --rm -v ${{ github.workspace }}:/source blackvoidclub/synobuild71 build.sh rtd1296 7.2

      - name: Upload SPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireGuard-rtd1296-dsm7
          path: output/*.spk
